[profile.default]
slow-timeout = { period = "120s", terminate-after = 15 }

[profile.ci]
failure-output = "immediate-final"
status-level = "fail"
slow-timeout = { period = "120s", terminate-after = 15 }

# Each corpus test already spawns a compiler process per program on up to four
# threads, so two of them at once saturate a runner.
[test-groups]
corpus = { max-threads = 2 }

[[profile.default.overrides]]
filter = "test(/^(golden_corpus|golden_programs|optimization_programs_agree_on_every_engine|corpus_collects_at_every_allocation)$/)"
test-group = "corpus"
