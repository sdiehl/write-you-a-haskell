repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: dprint
        name: dprint
        entry: dprint fmt --allow-no-files
        language: system
        files: \.(md|json|toml|ya?ml|typ)$
